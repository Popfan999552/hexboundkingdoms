name: Inspect build artifact diagnostics
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run ID in this repository
        required: true
        type: string
      artifact_id:
        description: Artifact ID in this repository
        required: true
        type: string
      package_release:
        description: Assemble current store materials with the artifact's validated offline AAB
        type: boolean
        default: false
      import_screenshot:
        description: Commit the artifact's verified Android gameplay screenshot to main
        type: boolean
        default: false
      retry_emulator:
        description: Retry emulator QA using the artifact's existing QA-only APK set
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/artifact-inspection
      - name: Report build diagnostics without external storage access in cloud
        run: python3 tools/inspect_artifact_logs.py "$RUNNER_TEMP/artifact-inspection"

  retry-emulator:
    if: inputs.retry_emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      XDG_CACHE_HOME: /tmp/hexbound/cache
      ANDROID_USER_HOME: /tmp/hexbound/android-user
      HEXBOUND_TEST_ADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/artifact-inspection
      - name: Retry existing QA APK without rebuilding or accepting SDK terms
        run: |
          set -euo pipefail
          export HEXBOUND_REUSE_APKS=$(find "$RUNNER_TEMP/artifact-inspection" -name test.apks -type f -print -quit)
          test -n "$HEXBOUND_REUSE_APKS"
          mkdir -p build/logs
          tools/android_emulator_qa.sh 2>&1 | tee build/logs/emulator-run.log
      - name: Report exact retry failure
        if: failure()
        run: python3 tools/report_ci_failure.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: emulator-retry-${{ github.run_number }}
          path: |
            build/emulator-qa/
            build/logs/
          if-no-files-found: error
          retention-days: 14

  import-screenshot:
    if: inputs.import_screenshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/verified-android-qa
      - name: Import only a passing QA capture
        run: python3 tools/import_android_screenshot.py "$RUNNER_TEMP/verified-android-qa"
      - name: Commit original Android gameplay capture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add google-play-release/screenshots/android-emulator-api35.png google-play-release/screenshots/android-emulator-api35-qa.json
          if ! git diff --cached --quiet; then
            git commit -m '[skip ci] Add verified actual Android gameplay screenshot'
            git push origin HEAD:main
          fi

  package-release:
    if: inputs.package_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/validated-offline-artifact
      - name: Assemble current release materials with verified offline bundle
        run: python3 tools/package_release.py "$RUNNER_TEMP/validated-offline-artifact"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: google-play-release-${{ github.run_number }}
          path: build/google-play-release.zip
          if-no-files-found: error
          retention-days: 14
