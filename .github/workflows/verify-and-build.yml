name: Validate and build Hexbound Kingdoms
on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
    inputs:
      test_ads:
        description: Include native AdMob/UMP with Google test IDs (requires device consent QA)
        type: boolean
        default: false
      sign_release:
        description: Sign with configured upload-key secrets; never publishes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: hexbound-${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_ads && 'ads' || 'offline' }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XDG_DATA_HOME: /tmp/hexbound/data
      XDG_CONFIG_HOME: /tmp/hexbound/config
      XDG_CACHE_HOME: /tmp/hexbound/cache
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Godot and checksum-verified templates
        run: |
          python3 tools/install_godot.py --engine --cache "$RUNNER_TEMP/hexbound-downloads"
          echo "$RUNNER_TEMP/hexbound-downloads/bin" >> "$GITHUB_PATH"
      - name: Import, rules, AI, saves and interactive UI tests
        run: tools/check.sh
      - name: Export desktop test build
        run: |
          tools/godot.sh --headless --path . --export-release Linux build/hexbound-linux.x86_64
          chmod +x build/hexbound-linux.x86_64
          build/hexbound-linux.x86_64 --headless -- --smoke
      - name: Capture actual gameplay
        run: |
          xvfb-run -a tools/godot.sh --path . --audio-driver Dummy --resolution 1920x1080 -- --capture
          xvfb-run -a tools/godot.sh --path . --audio-driver Dummy --resolution 1920x1080 -- --capture --developed
      - name: Sanitize diagnostic logs
        if: always()
        run: python3 tools/redact_build_logs.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: gameplay-validation-and-desktop
          path: |
            build/logs/
            build/hexbound-linux.x86_64
            google-play-release/screenshots/
          if-no-files-found: error
          retention-days: 14
  android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Fork pull requests never run with signing secrets.
    if: github.event_name != 'pull_request'
    env:
      XDG_DATA_HOME: /tmp/hexbound/data
      XDG_CONFIG_HOME: /tmp/hexbound/config
      XDG_CACHE_HOME: /tmp/hexbound/cache
      ANDROID_USER_HOME: /tmp/hexbound/android-user
      GRADLE_USER_HOME: /tmp/hexbound/gradle
      HEXBOUND_VERSION_CODE: ${{ github.run_number }}
      HEXBOUND_TEST_ADS: ${{ inputs.test_ads && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK without accepting legal agreements
        run: |
          test -n "$ANDROID_HOME"
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -f "$ANDROID_HOME/build-tools/36.1.0/aapt2" || ! -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties" ]]; then
            sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
            test -x "$sdk_manager" || { echo 'Android SDK manager is missing from the runner.' >&2; exit 1; }
            "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' </dev/null
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar" || {
            echo 'API 36 missing. An owner must provision a licensed SDK; this workflow never accepts SDK terms.' >&2
            exit 1
          }
      - name: Install pinned Godot and templates
        run: |
          python3 tools/install_godot.py --engine --cache "$RUNNER_TEMP/hexbound-downloads"
          echo "$RUNNER_TEMP/hexbound-downloads/bin" >> "$GITHUB_PATH"
      - name: Decode upload key in ephemeral runner storage
        if: inputs.sign_release
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_KEY_BASE64" && test -n "$UPLOAD_KEY_ALIAS" && test -n "$UPLOAD_KEY_PASSWORD" || {
            echo 'Missing Android upload-key signing secrets.' >&2
            exit 1
          }
          umask 077
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build and verify Android App Bundle
        run: tools/build_android.sh
      - name: Report concrete build failures
        if: failure()
        run: python3 tools/report_ci_failure.py
      - name: Remove ephemeral upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"
      - name: Sanitize diagnostic logs
        if: always()
        run: python3 tools/redact_build_logs.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-bundle-${{ github.run_number }}
          path: |
            build/*.aab
            build/bundle-check.json
            build/manifest-audit.json
            build/AndroidManifest.xml
            build/logs/
            google-play-release/
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact meaning
        if: success()
        run: |
          echo 'AAB artifact generated. Unsigned artifacts cannot be submitted; signed builds still require device QA and policy review. No upload or publication occurred.' >> "$GITHUB_STEP_SUMMARY"

  android-emulator:
    needs: android
    if: github.event_name == 'workflow_dispatch' && !inputs.sign_release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      XDG_DATA_HOME: /tmp/hexbound/data
      XDG_CONFIG_HOME: /tmp/hexbound/config
      XDG_CACHE_HOME: /tmp/hexbound/cache
      ANDROID_USER_HOME: /tmp/hexbound/android-user
      GRADLE_USER_HOME: /tmp/hexbound/gradle
      HEXBOUND_TEST_ADS: ${{ inputs.test_ads && '1' || '0' }}
      HEXBOUND_ANDROID_QA: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Godot/templates for QA-only build
        run: |
          python3 tools/install_godot.py --engine --cache "$RUNNER_TEMP/hexbound-downloads"
          echo "$RUNNER_TEMP/hexbound-downloads/bin" >> "$GITHUB_PATH"
      - name: Build QA-only bundle with automated play entry
        run: tools/build_android.sh
      - name: Install and exercise actual Android gameplay on emulator
        run: tools/android_emulator_qa.sh 2>&1 | tee build/logs/emulator-run.log
      - name: Report concrete emulator failures
        if: failure()
        run: |
          python3 tools/report_ci_failure.py
          if test -f build/emulator-qa/emulator.log; then tail -10 build/emulator-qa/emulator.log; fi
      - name: Sanitize diagnostic logs
        if: always()
        run: python3 tools/redact_build_logs.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-emulator-qa-${{ github.run_number }}
          path: |
            build/emulator-qa/
            build/logs/
          if-no-files-found: error
          retention-days: 14
